<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>成立库信息查询</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:#f2f4f8; color:#1f2733; font-size:15px; }

  .header { position:sticky; top:0; z-index:10; background:linear-gradient(135deg,#1a56db,#2f6ff0); padding:14px 14px 12px; box-shadow:0 2px 10px rgba(26,86,219,.25); }
  .header h1 { color:#fff; font-size:18px; font-weight:600; display:flex; align-items:center; gap:6px; }
  .header .sub { color:rgba(255,255,255,.85); font-size:12px; margin-top:3px; }

  .searchbox { margin-top:10px; display:flex; gap:8px; }
  .searchbox input { flex:1; height:44px; border:none; border-radius:10px; padding:0 14px; font-size:16px; background:#fff; outline:none; }
  .searchbox input::placeholder { color:#9aa5b5; }
  .btn-clear { height:44px; padding:0 14px; border:none; border-radius:10px; background:rgba(255,255,255,.22); color:#fff; font-size:14px; display:none; }
  .btn-clear.show { display:block; }

  .chips { display:flex; align-items:center; gap:8px; margin-top:10px; overflow-x:auto; padding-bottom:2px; -webkit-overflow-scrolling:touch; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex-shrink:0; padding:6px 14px; border-radius:16px; background:rgba(255,255,255,.2); color:#fff; font-size:13px; border:1px solid rgba(255,255,255,.35); }
  .chip.active { background:#fff; color:#1a56db; font-weight:600; border-color:#fff; }
  .region-label { flex-shrink:0; font-size:12px; color:rgba(255,255,255,.75); padding-left:2px; }

  .range-row { display:flex; align-items:center; gap:10px; margin-top:12px; padding:0 2px; }
  .range-row .region-label { padding-left:0; }
  .range-wrap { flex:1; position:relative; height:30px; }
  .range-wrap input[type=range] { position:absolute; left:0; right:0; top:50%; width:100%; height:4px; margin:0; padding:0; -webkit-appearance:none; appearance:none; background:transparent; pointer-events:none; transform:translateY(-50%); }
  .range-wrap input[type=range]::-webkit-slider-runnable-track { height:4px; border-radius:2px; background:rgba(255,255,255,.35); border:none; }
  .range-wrap input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:#fff; border:2px solid #1a56db; box-shadow:0 1px 4px rgba(0,0,0,.3); margin-top:-9px; pointer-events:auto; cursor:pointer; }
  .range-wrap #rhi { z-index:2; }
  .range-wrap #rlo { z-index:3; }
  .range-val { flex-shrink:0; min-width:74px; text-align:right; font-size:12px; color:#fff; font-weight:700; }

  .stats { padding:10px 14px 0; font-size:13px; color:#5b6675; display:flex; flex-wrap:wrap; align-items:center; gap:2px 12px; }
  .stats b { color:#1a56db; }
  .stats span { white-space:nowrap; }

  .list { padding:6px 8px 20px; display:flex; flex-direction:column; gap:6px; }

  .card { background:#fff; border-radius:10px; padding:8px 10px; box-shadow:0 1px 4px rgba(31,39,51,.06); }
  .card-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .waybill { font-size:15px; font-weight:700; letter-spacing:.3px; color:#111827; font-family:Menlo,Consolas,monospace; word-break:break-all; }
  .badge { flex-shrink:0; font-size:11px; font-weight:600; padding:2px 7px; border-radius:6px; }
  .badge.tf { background:#fdecea; color:#d93025; }
  .badge.tz { background:#fef3e2; color:#c26a00; }
  .badge.tzt { background:#f3e8fd; color:#8430ce; }
  .badge.other { background:#e8f0fe; color:#1a56db; }
  .badge.rej { background:#eceff3; color:#4b5563; border:1px dashed #9aa5b5; cursor:pointer; }
  .badge.rej::after { content:'▾'; margin-left:3px; font-size:9px; opacity:.65; }
  .badge.rej.open { background:#dfe4ec; border-style:solid; }
  .badge.rej.open::after { content:'▴'; }
  .rej-panel { display:none; margin-top:6px; background:#f6f8fb; border-left:3px solid #9aa5b5; border-radius:6px; padding:6px 9px; font-size:12px; line-height:1.55; color:#4b5563; }
  .rej-panel.show { display:block; }
  .rej-panel b { color:#374151; }

  .loc-line { display:flex; align-items:center; gap:8px; margin:6px 0 0; }
  .loc { font-size:16px; font-weight:800; color:#fff; background:#0e9f6e; border-radius:8px; padding:2px 10px; letter-spacing:1px; }
  .next { font-size:13px; color:#374151; font-weight:600; }
  .region-tag { flex-shrink:0; font-size:11px; font-weight:600; color:#8430ce; background:#f3e8fd; border-radius:6px; padding:1px 6px; }

  .grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:4px 5px; margin-top:6px; }
  .cell { background:#f7f9fc; border-radius:6px; padding:3px 6px; }
  .cell .k { font-size:10px; color:#8a94a6; }
  .cell .v { font-size:13px; font-weight:600; color:#1f2733; word-break:break-all; }
  .cell.hl .v { color:#d93025; }

  .time-line { margin-top:5px; font-size:11px; color:#8a94a6; display:flex; justify-content:space-between; align-items:center; }
  .copy { font-size:11px; color:#1a56db; padding:2px 8px; border:1px solid #c3d4f7; border-radius:6px; background:#f2f7ff; }

  .empty { text-align:center; padding:60px 20px; color:#8a94a6; }
  .empty .big { font-size:44px; margin-bottom:10px; }
  .empty .t1 { font-size:16px; color:#5b6675; font-weight:600; }
  .empty .t2 { font-size:13px; margin-top:6px; }

  .toast { position:fixed; left:50%; bottom:60px; transform:translateX(-50%); background:rgba(17,24,39,.88); color:#fff; font-size:13px; padding:9px 18px; border-radius:20px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:99; }
  .toast.show { opacity:1; }
  mark { background:#ffe58f; color:inherit; border-radius:2px; padding:0 1px; }
</style>
<meta name="robots" content="noindex, nofollow, noarchive">
<style>
#gate{position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#1a56db,#2f6ff0);display:flex;align-items:center;justify-content:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}
#gate .box{width:100%;max-width:320px;background:#fff;border-radius:14px;padding:22px 20px 18px;box-shadow:0 10px 30px rgba(0,0,0,.25);}
#gate h2{font-size:17px;color:#1f2733;margin-bottom:6px;font-weight:700;}
#gate .tip{font-size:12px;color:#8a94a6;margin-bottom:16px;line-height:1.5;}
#gate input{width:100%;height:44px;border:1px solid #d8dee9;border-radius:10px;padding:0 12px;font-size:16px;outline:none;}
#gate input:focus{border-color:#1a56db;}
#gate button{width:100%;height:44px;margin-top:12px;border:none;border-radius:10px;background:#1a56db;color:#fff;font-size:15px;font-weight:600;}
#gate button:disabled{opacity:.6;}
#gate .err{margin-top:10px;font-size:12px;color:#d93025;min-height:16px;}
</style>
</head>
<body>
<div id="gate">
  <div class="box">
    <h2>成立库信息查询</h2>
    <div class="tip">请输入访问口令（共 662 条 · 数据日期 2026-11-25）</div>
    <input id="gatePwd" type="password" placeholder="访问口令" autocomplete="current-password">
    <button id="gateBtn">进入看板</button>
    <div class="err" id="gateErr"></div>
  </div>
</div>
<div class="header">
  <h1>📦 成立库信息查询</h1>
  <div class="sub" id="updateInfo">货区核查明细 · 单号速查 ｜ 共 662 条 · 数据日期 2026-11-25</div>
  <div class="searchbox">
    <input id="q" type="search" placeholder="输入/粘贴运单号、库位、下一站、货名" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <button class="btn-clear" id="btnClear">清空</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="chips" id="regionChips"></div>
  <div class="range-row">
    <span class="region-label">成立天数</span>
    <div class="range-wrap">
      <input type="range" id="rlo" min="0" max="60" value="0" step="1">
      <input type="range" id="rhi" min="0" max="60" value="15" step="1">
    </div>
    <span class="range-val" id="rangeVal"></span>
  </div>
  <div class="chips" id="sortChips"><span class="region-label">排序</span><div class="chip active" data-s="amt">金额从高到低</div><div class="chip" data-s="loc">库位顺序</div></div>
</div>

<div class="stats" id="stats"></div>
<div class="list" id="list"></div>
<div class="toast" id="toast"></div>

<script id="appsrc" type="text/plain">
const DATA = window.__CHENGLI_DATA__;

const $ = id => document.getElementById(id);
const listEl = $('list'), statsEl = $('stats'), chipsEl = $('chips'), regionEl = $('regionChips'), qEl = $('q'), btnClear = $('btnClear');
let curRegion = '全部';      // 区域单选
let loDays = 0, hiDays = 15;  // 成立天数范围(滑块, 默认0~15天)
let sortMode = 'amt';         // 排序: 'amt'=金额从高到低(默认), 'loc'=库位顺序

// 类型 chips（可复选，默认全部选中，点击反选排除）
const typeParts = d => String(d.type || '').split('+');
const types = [...Array.from(new Set(DATA.reduce((acc, d) => acc.concat(typeParts(d)), []))).filter(Boolean)];
let curTypes = new Set(types);   // 默认全选
chipsEl.innerHTML = `<div class="chip active" data-all="1">全部(${DATA.length})</div>` +
  types.map(t => `<div class="chip active" data-t="${esc(t)}">${esc(t)}(${DATA.filter(d=>typeParts(d).indexOf(t)>=0).length})</div>`).join('');
chipsEl.addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  if (c.dataset.all !== undefined) { curTypes = new Set(types); }   // 恢复全选
  else {
    const t = c.dataset.t;
    if (curTypes.has(t)) curTypes.delete(t); else curTypes.add(t);
  }
  chipsEl.querySelectorAll('.chip').forEach(x => {
    if (x.dataset.all !== undefined) x.classList.toggle('active', curTypes.size === types.length);
    else x.classList.toggle('active', curTypes.has(x.dataset.t));
  });
  render();
});

// 区域 chips（单选）
const REGIONS = ['一区','二区','三区','四区','五区','六区','七区','八区'];
const regionCount = r => DATA.filter(d => d.region === r).length;
const otherCount = DATA.filter(d => !d.region).length;
regionEl.innerHTML = `<span class="region-label">区域</span><div class="chip active" data-r="全部">全部(${DATA.length})</div>` +
  REGIONS.map(r => `<div class="chip" data-r="${r}">${r}(${regionCount(r)})</div>`).join('') +
  `<div class="chip" data-r="其他">其他(${otherCount})</div>`;
regionEl.addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  curRegion = c.dataset.r;
  regionEl.querySelectorAll('.chip').forEach(x => x.classList.toggle('active', x.dataset.r === curRegion));
  render();
});

// 排序 chips（单选: 金额从高到低(默认) / 库位顺序）
const sortEl = $('sortChips');
sortEl.addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  sortMode = c.dataset.s;
  sortEl.querySelectorAll('.chip').forEach(x => x.classList.toggle('active', x.dataset.s === sortMode));
  render();
});

// 成立天数双滑块(0~maxDays, 默认0~15天; 天数每天会变化, 默认只看近期)
// 兜底: 若近15天内没有任何数据(反馈数据整体偏旧), 默认自动放宽为全部天数, 防止页面默认0条
const DEFAULT_DAYS = 15;
const maxDays = Math.max(1, ...DATA.map(d => Number(d.days) || 0));
const rloEl = $('rlo'), rhiEl = $('rhi'), rangeValEl = $('rangeVal');
rloEl.max = rhiEl.max = String(maxDays);
const defaultHi = DATA.some(d => (Number(d.days) || 0) <= Math.min(DEFAULT_DAYS, maxDays)) ? Math.min(DEFAULT_DAYS, maxDays) : maxDays;
hiDays = defaultHi; rhiEl.value = String(defaultHi);
function updateRangeVal(){
  rangeValEl.textContent = (loDays === 0 && hiDays === defaultHi) ? (defaultHi >= maxDays ? `默认(全部天数)` : `默认(0~${defaultHi}天)`) : `${loDays}~${hiDays}天`;
}
rloEl.addEventListener('input', () => {
  loDays = Number(rloEl.value);
  if (loDays > hiDays) { hiDays = loDays; rhiEl.value = String(hiDays); }
  updateRangeVal(); render();
});
rhiEl.addEventListener('input', () => {
  hiDays = Number(rhiEl.value);
  if (hiDays < loDays) { loDays = hiDays; rloEl.value = String(loDays); }
  updateRangeVal(); render();
});

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function hilite(s, kw){
  s = esc(s);
  if (!kw) return s;
  const i = s.toLowerCase().indexOf(kw.toLowerCase());
  if (i < 0) return s;
  return s.slice(0,i) + '<mark>' + s.slice(i, i+kw.length) + '</mark>' + s.slice(i+kw.length);
}
function badgeCls(t){
  if (t === '偷方') return 'tf';
  if (t === '偷重') return 'tz';
  if (t && t.indexOf('偷重') >= 0 && t.indexOf('偷方') >= 0) return 'tzt';
  return 'other';
}
function copy(text){
  const done = () => showToast('已复制 ' + text);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallback(text, done));
  } else fallback(text, done);
}
function fallback(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch(e){ showToast('复制失败'); }
  document.body.removeChild(ta);
}
let toastTimer;
function showToast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1500);
}

function render(){
  const kw = qEl.value.trim();
  btnClear.classList.toggle('show', kw.length > 0);
  const allTypesSel = curTypes.size === types.length;
  const regionOk = d => curRegion === '全部' ? true : (curRegion === '其他' ? !d.region : d.region === curRegion);
  const typeOk = d => allTypesSel || typeParts(d).some(t => curTypes.has(t));
  const daysOk = d => { const v = Number(d.days) || 0; return v >= loDays && v <= hiDays; };
  updateRangeVal();

  // 类型chips数量随区域+天数联动
  chipsEl.querySelectorAll('.chip').forEach(x => {
    let n;
    if (x.dataset.all !== undefined) n = DATA.filter(d => regionOk(d) && daysOk(d)).length;
    else n = DATA.filter(d => regionOk(d) && daysOk(d) && typeParts(d).indexOf(x.dataset.t) >= 0).length;
    x.textContent = (x.dataset.all !== undefined ? '全部' : x.dataset.t) + '(' + n + ')';
  });
  // 区域chips数量随类型+天数联动
  regionEl.querySelectorAll('.chip').forEach(x => {
    let n;
    if (x.dataset.r === '全部') n = DATA.filter(d => typeOk(d) && daysOk(d)).length;
    else if (x.dataset.r === '其他') n = DATA.filter(d => typeOk(d) && daysOk(d) && !d.region).length;
    else n = DATA.filter(d => typeOk(d) && daysOk(d) && d.region === x.dataset.r).length;
    x.textContent = x.dataset.r + '(' + n + ')';
  });

  let rows = DATA.filter(d => typeOk(d) && regionOk(d) && daysOk(d));
  if (kw) {
    const k = kw.toLowerCase();
    rows = rows.filter(d =>
      (d.wb||'').toLowerCase().includes(k) ||
      (d.loc||'').toLowerCase().includes(k) ||
      (d.next||'').toLowerCase().includes(k) ||
      (d.goods||'').toLowerCase().includes(k) ||
      (d.type||'').toLowerCase().includes(k) ||
      (d.pack||'').toLowerCase().includes(k)
    );
  }
  // 排序: 金额从高到低(默认, 同金额保持库位先后) / 库位顺序(库位→单号, 同build口径)
  if (sortMode === 'amt') {
    rows.sort((a, b) => (parseFloat(b.amt) || 0) - (parseFloat(a.amt) || 0));
  } else {
    rows.sort((a, b) => (a.loc || '').localeCompare(b.loc || '') || (a.wb || '').localeCompare(b.wb || ''));
  }
  const totalAmt = rows.reduce((s,d) => s + (parseFloat(d.amt)||0), 0);
  const rejN = rows.filter(d => Number(d.rejCnt) > 0).length;
  statsEl.innerHTML = `<span>共 <b>${rows.length}</b> 条${kw?`（匹配"${esc(kw)}"）`:''}</span><span>金额合计 <b>¥${totalAmt.toFixed(1)}</b></span>${rejN ? `<span>上报不成立 <b>${rejN}</b> 条</span>` : ''}`;

  if (!rows.length) {
    listEl.innerHTML = `<div class="empty"><div class="big">🔍</div><div class="t1">未找到"${esc(kw) || '当前筛选'}"相关记录</div><div class="t2">${kw ? '该单号不在成立库信息表中，请核对后重试' : '换个筛选条件试试'}</div></div>`;
    return;
  }
  listEl.innerHTML = rows.map((d,i) => {
    const multi = String(d.type || '').indexOf('+') >= 0;
    const rejTxt = Number(d.rejCnt) > 0
      ? `该票开单网点+体积+重量与「上报不成立」记录一致：<b>${esc(d.rejCnt)}</b> 次不定责，最近 <b>${esc(d.rejLast || '-')}</b>`
      : '';
    return `
    <div class="card">
      <div class="card-top">
        <div class="waybill">${hilite(d.wb, kw)}</div>
        <span style="display:flex;gap:4px;flex-shrink:0;align-items:center;">
          ${Number(d.rejCnt) > 0 ? `<span class="badge rej" role="button" aria-expanded="false" data-rej="1">上报不成立</span>` : ''}
          <span class="badge ${badgeCls(d.type)}">${esc(d.type||'-')}</span>
        </span>
      </div>
      ${rejTxt ? `<div class="rej-panel">${rejTxt}</div>` : ''}
      <div class="loc-line">
        <span class="loc">${hilite(d.loc||'-', kw)}</span>
        <span class="next">${hilite(d.next||'', kw)}</span>
        <span class="region-tag">${esc(d.region||'其他')}</span>
      </div>
      <div class="grid">
        <div class="cell"><div class="k">库存件数</div><div class="v">${esc(d.qty)}</div></div>
        <div class="cell"><div class="k">重量(kg)</div><div class="v">${esc(d.wt)}</div></div>
        <div class="cell"><div class="k">体积(m³)</div><div class="v">${esc(d.vol)}</div></div>
        <div class="cell"><div class="k">包装</div><div class="v">${esc(d.pack||'-')}</div></div>
        <div class="cell"><div class="k">货物名称</div><div class="v">${hilite(d.goods, kw)}</div></div>
        <div class="cell hl"><div class="k">最小差方</div><div class="v">${esc(d.diff)}</div></div>
        <div class="cell"><div class="k">金额(元)</div><div class="v">${esc(d.amt)}${multi ? `（${esc(d.amtType||'')}）` : ''}</div></div>
        <div class="cell"><div class="k">成立条数</div><div class="v">${multi ? `（${esc(d.cntDetail||d.cnt)}）` : esc(d.cnt)}</div></div>
        <div class="cell"><div class="k">上报成立天数</div><div class="v">${esc(d.days)}${multi ? `（${esc(d.daysType||'')}）` : ''}</div></div>
      </div>
      <div class="time-line">
        <span>🕒 运输时间 ${esc(d.time||'-')}</span>
        <button class="copy" data-wb="${esc(d.wb)}">复制单号</button>
      </div>
    </div>`;
  }).join('');
}

listEl.addEventListener('click', e => {
  const r = e.target.closest('.badge.rej');
  if (r) {
    const card = r.closest('.card');
    const panel = card && card.querySelector('.rej-panel');
    if (panel) {
      const open = panel.classList.toggle('show');
      r.classList.toggle('open', open);
      r.setAttribute('aria-expanded', open ? 'true' : 'false');
    }
    return;
  }
  const b = e.target.closest('.copy');
  if (b) { copy(b.dataset.wb); return; }
  const w = e.target.closest('.waybill');
  if (w) copy(w.textContent.trim());
});

let debounce;
qEl.addEventListener('input', () => { clearTimeout(debounce); debounce = setTimeout(render, 120); });
btnClear.addEventListener('click', () => { qEl.value=''; render(); qEl.focus(); });

render();
